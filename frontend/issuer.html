<!DOCTYPE html>
<html lang="en">
<head>
    <title>Issuer Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/issuer_styles.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="myContainer">
        <header class="title_card d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/frontend/index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
                <svg class="bi me-2" width="40" height="32"></svg>
                <span class="fs-4" style="color: white;">University Credential Verifier</span>
            </a>
        </header>

        <div class="main_content">
            <div class="content_title">
                <h2>Issuer Control Panel</h2>
                <div id="accountAddress"></div>
            </div>

            <div id="statusMessage" class="alert d-none"></div>

            <div class="control_panel">
                <div id="Issuer_controls">
                    <div>
                        <h3>Credential Revoke & Restore</h3>
                        <input type="number" id="credentialIdRevoke" placeholder="Credential ID">
                        <button type="button" class="btn btn-danger" onclick="revokeCredential()">Revoke</button>
                        <button type="button" class="btn btn-success" onclick="restoreCredential()">Restore</button>
                    </div>

                    <div class="card mt-4">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h3>
                                <i class="fa-solid fa-clipboard-list"></i>
                                Issued Credentials
                            </h3>
                            <div>
                                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#issueCredentialModal">
                                    New Credential
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                                <button class="btn btn-warning btn-sm" onclick="loadIssuedCredentials()">
                                    Refresh
                                    <i class="fa-solid fa-arrows-rotate"></i>
                                </button>
                            </div>
                        </div>

                        <div class="card-body table-responsive">
                            <table id="issued_credential_table" class="table table-bordered table-striped">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Student</th>
                                        <th>Type</th>
                                        <th>Document Hash</th>
                                        <th>Status</th>
                                        <th>Timestamp</th>
                                        <th>File</th>
                                    </tr>
                                </thead>
                                <tbody id="issuedCredentialsTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center">No credentials loaded.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="issueCredentialModal" tabindex="-1" aria-labelledby="issueCredentialModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title" id="issueCredentialModalLabel">
                        <i class="fa-solid fa-file-pen"></i>
                        Issue New Credential
                    </h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <label class="form-label">Student Wallet Address</label>
                    <input class="form-control mb-3" type="text" id="userAddress" placeholder="Enter Student Wallet Address">

                    <label class="form-label">Credential Type</label>
                    <select class="form-select mb-3" id="credentialType">
                        <option value="Diploma">Diploma</option>
                        <option value="Transcript">Transcript</option>
                        <option value="Bachelor Degree">Bachelor Degree</option>
                        <option value="Master Degree">Master Degree</option>
                        <option value="Certificate">Certificate</option>
                    </select>

                    <label class="form-label">Document Hash</label>
                    <div class="input-group mb-2">
                        <input class="form-control" type="text" id="documentHash" placeholder="Upload File To Generate Hash Code" readonly disabled>
                    </div>

                    <input class="form-control" type="file" id="documentFile" accept="application/pdf,.pdf" onchange="handleFileUpload()">
                    <small id="uploadedFileInfo" class="text-muted d-block mb-3"></small>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="issueCredential()">Issue Credential</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/issuer.js"></script>
</body>
</html>
