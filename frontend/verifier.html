<!DOCTYPE html>
<html lang="en">
<head>
    <title>Verifier Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/verifier_styles.css">
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="myContainer">
        <header class="title_card d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/frontend/index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
                <svg class="bi me-2" width="40" height="32"></svg>
                <span class="fs-4" style="color: white;">University Credential Verifier</span>
            </a>
        </header>

        <div class="main_content">
            <div class="content_title">
                <h2>Verifier Control Panel</h2>
                <pre id="verifierInfo"></pre>
            </div>

            <div id="statusMessage" class="alert d-none"></div>

            <div class="control_panel">
                <div class="card mt-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h3><i class="fa-solid fa-shield-halved"></i> Verify Credential</h3>
                    </div>
                    <div class="card-body">
                        <label class="form-label">Issuer Contract Address</label>
                        <input class="form-control mb-3" type="text" id="issuerContractAddress" placeholder="Issuer contract address">

                        <label class="form-label">Credential ID</label>
                        <input class="form-control mb-3" type="number" id="credentialIdLookup" placeholder="Credential ID">

                        <label class="form-label">Credential PDF</label>
                        <input class="form-control" type="file" id="documentFile" accept="application/pdf,.pdf">
                        <pre id="documentHashPreview" class="mt-2"></pre>

                        <button type="button" class="btn btn-primary" onclick="verifyCredential()">Verify</button>
                        <pre id="credentialDetails" class="mt-3"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="js/verifier.js"></script>
</body>
</html>
