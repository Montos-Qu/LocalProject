<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/admin_styles.css">
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>

    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="myContainer">
        <header class="title_card d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom">
            <a href="/frontend/index.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
                <svg class="bi me-2" width="40" height="32"></svg>
                <span class="fs-4" style="color: white;">University Credential Verifier</span>
            </a>
        </header>

        <div class="content_title">
            <h2>Admin Control Panel</h2>
            <div id="accountAddress"></div>
        </div>
        
        <hr>

        <div class="main_content">
            <div class="d-flex justify-content-between align-items-center">
                <h4>Registered Users</h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    Add New User
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <table id="usersTable" class="display table table-striped">
                <thead>
                    <tr>
                        <th>Wallet Address</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h3 class="modal-title" id="addUserModalLabel">
                        <i class="fa-solid fa-file-pen"></i>
                        Add User Account
                    </h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body" id="add_user_modal">
                    <label class="form-label">User Address</label>
                    <input class="form-control mb-3" type="text" id="userAddress" placeholder="Enter wallet address">

                    <label class="form-label">User Name</label>
                    <input class="form-control mb-3" type="text" id="username" placeholder="Enter user's name">

                    <label class="form-label">Document Hash</label>
                    <select class="form-select" id="accountType">
                        <option value="1">Student</option>
                        <option value="2">Issuer</option>
                        <option value="3">Verifier</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-success" onclick="addUserAccount()">
                        Submit
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
